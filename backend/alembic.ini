[alembic]
# Path to the migration scripts directory, relative to this file
# (backend/alembic/).
script_location = alembic

# Timezone-aware UTC timestamps in migration filenames.
# Format: 2026_08_20_1234_-_add_users_table.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_-_%%(slug)s
timezone = UTC
truncate_slug_length = 60

# alembic uses INI-style % interpolation, so we escape %.
sqlalchemy.url =

# ---- prepend / append paths ----------------------------------------------
# Alembic launches with cwd=backend/, so app.* imports resolve.
prepend_sys_path = .

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
