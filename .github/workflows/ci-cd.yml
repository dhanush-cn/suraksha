name: RockfallGuard CI

# Runs on every push/PR to main and to the refactor branches. Nothing here
# gates on a model accuracy number -- see MODEL_CARD.md for why the old
# ">95% accuracy" gate was removed. ml/train_model.py prints its honest
# metrics into the job log instead.

on:
  push:
    branches: ["main", "master", "refactor/**", "feat/**"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      REDIS_URL: redis://127.0.0.1:6379/0
      LOG_JSON: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 3.12 matches the local .venv. The code needs >= 3.11 (enum.StrEnum).
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r backend/requirements.txt

      - name: Train tabular models (prints metrics, does not gate on them)
        run: python ml/train_model.py

      - name: Apply migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Verification scripts
        working-directory: backend
        run: |
          set -e
          for f in verify_core.py verify_persistence.py verify_services.py \
                   verify_redis.py verify_workers.py verify_observability.py \
                   verify_multitenant.py verify_rag.py; do
            echo "::group::$f"
            python "$f"
            echo "::endgroup::"
          done

      - name: pytest
        working-directory: backend
        run: python -m pytest tests -v

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: rockfallguard:ci
