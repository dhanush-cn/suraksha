name: RockfallGuard CI/CD Pipeline & ML Accuracy Verification

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # JOB 1: Test Automation & ML Model >95% Accuracy Verification
  test-and-verify-ml:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Train ML Engine & Verify >95% Accuracy Requirement
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          python ml/train_model.py

      - name: Run PyTest Automated Integration Suite
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          pytest backend/tests/test_app.py -v

  # JOB 2: Docker Containerization Build & Health Verification
  docker-build-check:
    needs: test-and-verify-ml
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker Container Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: rockfallguard:latest
